<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12080f">
<meta name="description" content="Kaoruko Waguri - bot de Telegram com downloads, IA, pesquisa e logos.">
<title>Kaoruko Waguri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="/estilo.css">
</head>
<body>

<div class="petalas" id="petalas"></div>

<header class="topo">
  <a class="marca" href="#/">
    <i class="fa-solid fa-fan marca-icone"></i>
    <span class="marca-txt">Kaoruko<em>Waguri</em></span>
  </a>

  <nav class="nav" id="nav">
    <a href="#/" data-rota="/"><i class="fa-solid fa-house"></i> Inicio</a>
    <a href="#/comandos" data-rota="/comandos"><i class="fa-solid fa-terminal"></i> Comandos</a>
    <a href="#/planos" data-rota="/planos"><i class="fa-solid fa-gem"></i> Planos</a>
    <a href="#/painel" data-rota="/painel" class="oculto" id="nav-painel"><i class="fa-solid fa-gauge-high"></i> Painel</a>
    <a href="#/admin" data-rota="/admin" class="oculto" id="nav-admin"><i class="fa-solid fa-shield-halved"></i> Admin</a>
  </nav>

  <div class="topo-acoes">
    <button class="btn btn-fantasma" id="btn-entrar"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    <div class="perfil oculto" id="perfil">
      <span class="perfil-badge" id="perfil-plano"></span>
      <span class="perfil-nome" id="perfil-nome"></span>
      <button class="btn-sair" id="btn-sair" title="Sair"><i class="fa-solid fa-power-off"></i></button>
    </div>
    <button class="menu-mob" id="menu-mob" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<main id="app"></main>

<footer class="rodape">
  <span><i class="fa-solid fa-fan"></i> Kaoruko Waguri</span>
  <span class="sep">&middot;</span>
  <span>OKARUN API</span>
  <span class="sep">&middot;</span>
  <span id="rodape-status">carregando</span>
</footer>

<div class="modal-fundo oculto" id="modal-auth">
  <div class="modal">
    <button class="modal-x" id="modal-x" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>

    <div class="modal-icone"><i class="fa-solid fa-lock"></i></div>
    <h2 id="auth-titulo">Entrar</h2>
    <p class="modal-sub" id="auth-sub">Use seu e-mail e senha pra acessar o painel.</p>

    <form id="form-auth" autocomplete="on">
      <div class="campo campo-nome oculto" id="campo-nome">
        <label for="in-nome">Nome</label>
        <div class="input-icone">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="in-nome" name="name" placeholder="Como quer ser chamado" autocomplete="name">
        </div>
      </div>

      <div class="campo">
        <label for="in-email">E-mail</label>
        <div class="input-icone">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="in-email" name="email" placeholder="voce@email.com" autocomplete="email" required>
        </div>
      </div>

      <div class="campo">
        <label for="in-senha">Senha</label>
        <div class="input-icone">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="in-senha" name="password" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="button" class="ver-senha" id="ver-senha" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="modal-erro oculto" id="auth-erro"></div>

      <button type="submit" class="btn btn-cheio" id="btn-confirmar">
        <i class="fa-solid fa-right-to-bracket"></i> Entrar
      </button>
    </form>

    <button class="modal-link oculto" id="btn-alternar">
      Nao tem conta? <strong>Criar agora</strong>
    </button>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
